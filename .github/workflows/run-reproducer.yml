name: Run reproducer on each commit
on: push
jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: release-candidate
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
        build-scan-terms-of-use-agree: "yes"

    - name: Reproducer 1 - Run Inner build
      working-directory: ./inner
      run: ./gradlew clean publishToMavenLocal

    - name: Reproducer 1 - Run Outer build in success mode (should succeed)
      working-directory: ./outer
      run: ./gradlew clean build

    - name: Reproducer 1 - Run Outer build in failure mode (should fail)
      working-directory: ./outer
      run: ./gradlew -PtriggerBug=true clean build
      continue-on-error: true

    - name: Reproducer 2 - Run Inner build without fork
      working-directory: ./inner
      run: ./gradlew -PavoidBug=true clean publishToMavenLocal

    - name: Reproducer 2 - Run Outer build in success mode
      working-directory: ./outer
      run: ./gradlew clean build

    - name: Reproducer 2 - Run Outer build in failure mode (should succeed)
      working-directory: ./outer
      run: ./gradlew -PtriggerBug=true clean build
      continue-on-error: true

    - name: Reproducer 3 - Run Composite build in success mode (should succeed)
      working-directory: ./composite
      run: ./gradlew :outer:core:clean :outer:core:build

    - name: Reproducer 3 - Run Composite build in failure mode (should succeed)
      working-directory: ./composite
      run: ./gradlew -PtriggerBug=true :outer:core:clean :outer:core:build

